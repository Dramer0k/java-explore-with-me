services:
  ewm-service:
    container_name: ewm-service
    build:
      context: .
      dockerfile: ./ewm-service/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_DATASOURCE_URL: jdbc:postgresql://main-db:5432/ewm_main
      SPRING_DATASOURCE_USERNAME: ewm_user
      SPRING_DATASOURCE_PASSWORD: ewm_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      main-db:
        condition: service_healthy
      stats-server:
        condition: service_healthy
    networks:
      - app-net
    restart: unless-stopped

  stats-server:
    build: stats/stat_srv
    container_name: stats-server
    ports:
      - "9090:9090"
    environment:
      SERVER_PORT: "9090"
      SPRING_DATASOURCE_URL: jdbc:postgresql://stats-db:5432/stats
      SPRING_DATASOURCE_USERNAME: stats_user
      SPRING_DATASOURCE_PASSWORD: stats_password

      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info"
    depends_on:
      stats-db:
        condition: service_healthy
    networks:
      - app-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9090/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s

  stats-client:
    build: stats/stat_clt
    container_name: stats-client
    depends_on:
      stats-server:
        condition: service_healthy
    environment:
      STATS_SERVER_URL: http://stats-server:9090
    ports:
      - "8070:8070"
    networks:
      - app-net

  main-db:
    container_name: main-db
    image: postgres:16.1
    environment:
      POSTGRES_DB: ewm_main
      POSTGRES_USER: ewm_user
      POSTGRES_PASSWORD: ewm_password
    volumes:
      - main-db-data:/var/lib/postgresql/data
      - ./init-main.sql:/docker-entrypoint-initdb.d/init-main.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ewm_user -d ewm_main -h 127.0.0.1 -p 5432" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - app-net
    restart: unless-stopped

  stats-db:
    image: postgres:16.1
    container_name: stats-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: stats
      POSTGRES_USER: stats_user
      POSTGRES_PASSWORD: stats_password
    volumes:
      - stats-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stats_user -d stats"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks:
      - app-net
    restart: unless-stopped

volumes:
  main-db-data:
  stats-db-data:

networks:
  app-net:
    driver: bridge